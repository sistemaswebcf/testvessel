name: Actualizar Vessels CSV

on:
  schedule:
    # Se ejecuta cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  descargar-y-guardar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar script de exportacion
        shell: pwsh
        run: |
          ./export_vessels.ps1

      - name: Guardar y subir cambios (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vessels.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar vessels.csv [skip ci]" && git push)
